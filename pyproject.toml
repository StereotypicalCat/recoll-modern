[project]
name = "recoll-modern"
version = "0.1.0"
description = "A self-hosted HTTP API for Recoll full-text search"
readme = "README.md"
authors = [
    { name = "Lucas Winther", email = "lucwin@ece.au.dk" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
recoll-modern = "recoll_modern.__main__:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
